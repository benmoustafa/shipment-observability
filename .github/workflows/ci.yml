name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: pytest -v

  dbt:
    name: dbt Models & Quality Tests
    runs-on: ubuntu-latest
    needs: pytest  # Only runs if pytest passes

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: shipment_observability
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dbt-mysql
        run: |
          pip install "dbt-core>=1.7,<1.9" "dbt-mysql>=1.7,<1.9"

      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILEEOF'
          shipment_dbt:
            target: ci
            outputs:
              ci:
                type: mysql
                server: 127.0.0.1
                port: 3306
                schema: shipment_observability
                username: root
                password: testpassword
                ssl_disabled: true
          PROFILEEOF

      - name: Create custom dbt schemas in MySQL
        env:
          MYSQL_PWD: testpassword
        run: |
          mysql -h 127.0.0.1 -u root shipment_observability \
            -e "CREATE DATABASE IF NOT EXISTS shipment_observability_staging;
                CREATE DATABASE IF NOT EXISTS shipment_observability_intermediate;
                CREATE DATABASE IF NOT EXISTS shipment_observability_marts;"

      - name: Seed CI sample data
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASSWORD: "testpassword"
          DB_NAME: "shipment_observability"
        run: python tests/ci_seed.py

      - name: Verify dbt connection
        run: dbt debug --project-dir dbt/shipment_dbt --profiles-dir ~/.dbt --target ci

      - name: Run dbt models
        run: dbt run --project-dir dbt/shipment_dbt --profiles-dir ~/.dbt --target ci

      - name: Run dbt tests
        run: dbt test --project-dir dbt/shipment_dbt --profiles-dir ~/.dbt --target ci
