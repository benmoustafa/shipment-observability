<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background-color: #0b0d14; font-family: 'Inter', system-ui, sans-serif;">
  <rect width="1000" height="560" fill="#0b0d14"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="560" fill="#0f172a" stroke="#1e293b"/>
  <text x="20" y="40" fill="#f8fafc" font-size="14" font-weight="700">Platform Navigation</text>
  <line x1="20" y1="55" x2="200" y2="55" stroke="#334155"/>
  
  <rect x="15" y="75" width="190" height="32" rx="6" fill="#1e293b"/>
  <text x="30" y="96" fill="#38bdf8" font-size="12" font-weight="600">Pipeline Health Overview</text>
  
  <text x="30" y="140" fill="#94a3b8" font-size="12">Supply Chain Analytics</text>
  <text x="30" y="175" fill="#94a3b8" font-size="12">Statistical Anomalies</text>
  <text x="30" y="210" fill="#94a3b8" font-size="12">dbt Test Audit History</text>
  <text x="30" y="245" fill="#94a3b8" font-size="12">Upstream Schema Drift Log</text>

  <!-- Header -->
  <text x="250" y="45" fill="#ffffff" font-size="22" font-weight="700">Shipment Data Observability &amp; Analytics</text>
  <text x="250" y="68" fill="#64748b" font-size="12">Enterprise data quality monitoring, drift control, and logistics performance analytics.</text>
  <line x1="250" y1="82" x2="970" y2="82" stroke="#1e293b"/>

  <!-- Top Metrics -->
  <g transform="translate(250, 100)">
    <rect x="0" y="0" width="165" height="70" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="15" y="25" fill="#94a3b8" font-size="10" font-weight="600">PIPELINE STATUS</text>
    <text x="15" y="52" fill="#34d399" font-size="18" font-weight="700">HEALTHY</text>

    <rect x="180" y="0" width="165" height="70" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="195" y="25" fill="#94a3b8" font-size="10" font-weight="600">TEST PASS RATE</text>
    <text x="195" y="52" fill="#38bdf8" font-size="18" font-weight="700">97.0%</text>

    <rect x="360" y="0" width="165" height="70" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="375" y="25" fill="#94a3b8" font-size="10" font-weight="600">TOTAL REVENUE</text>
    <text x="375" y="52" fill="#f0f6fc" font-size="18" font-weight="700">$36,792,600</text>

    <rect x="540" y="0" width="175" height="70" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="555" y="25" fill="#94a3b8" font-size="10" font-weight="600">OVERALL LATE RATE</text>
    <text x="555" y="52" fill="#f59e0b" font-size="18" font-weight="700">54.8%</text>
  </g>

  <!-- Charts Area -->
  <!-- Chart 1: Revenue by Market -->
  <g transform="translate(250, 195)">
    <rect x="0" y="0" width="350" height="180" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="15" y="25" fill="#f0f6fc" font-size="12" font-weight="600">Revenue &amp; Net Profit by Regional Market</text>
    
    <!-- Bars -->
    <rect x="35" y="110" width="22" height="40" fill="#38bdf8"/>
    <rect x="60" y="130" width="22" height="20" fill="#34d399"/>
    <text x="48" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">LATAM</text>

    <rect x="105" y="120" width="22" height="30" fill="#38bdf8"/>
    <rect x="130" y="135" width="22" height="15" fill="#34d399"/>
    <text x="118" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">Europe</text>

    <rect x="175" y="130" width="22" height="20" fill="#38bdf8"/>
    <rect x="200" y="140" width="22" height="10" fill="#34d399"/>
    <text x="188" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">APAC</text>

    <rect x="245" y="140" width="22" height="10" fill="#38bdf8"/>
    <rect x="270" y="145" width="22" height="5" fill="#34d399"/>
    <text x="258" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">USCA</text>
  </g>

  <!-- Chart 2: Late Rate by Shipping Mode -->
  <g transform="translate(620, 195)">
    <rect x="0" y="0" width="350" height="180" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="15" y="25" fill="#f0f6fc" font-size="12" font-weight="600">Late Delivery Rate by Shipping Class</text>
    
    <rect x="25" y="125" width="40" height="25" fill="#ef4444"/>
    <text x="45" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">Standard</text>

    <rect x="105" y="70" width="40" height="80" fill="#ef4444"/>
    <text x="125" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">Second</text>

    <rect x="185" y="50" width="40" height="100" fill="#ef4444"/>
    <text x="205" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">First</text>

    <rect x="265" y="110" width="40" height="40" fill="#f59e0b"/>
    <text x="285" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">Same Day</text>
  </g>

  <!-- Alerts Table Preview -->
  <g transform="translate(250, 395)">
    <rect x="0" y="0" width="720" height="145" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="15" y="25" fill="#f0f6fc" font-size="12" font-weight="600">Open System Alerts &amp; Quality Discrepancies</text>
    
    <!-- Table Header -->
    <rect x="15" y="38" width="690" height="24" fill="#1e293b"/>
    <text x="25" y="54" fill="#94a3b8" font-size="10" font-weight="600">Type</text>
    <text x="160" y="54" fill="#94a3b8" font-size="10" font-weight="600">Check Name</text>
    <text x="370" y="54" fill="#94a3b8" font-size="10" font-weight="600">Model Target</text>
    <text x="490" y="54" fill="#94a3b8" font-size="10" font-weight="600">Severity</text>
    <text x="560" y="54" fill="#94a3b8" font-size="10" font-weight="600">Message</text>

    <!-- Table Row -->
    <text x="25" y="80" fill="#f0f6fc" font-size="11">Static Business Rule</text>
    <text x="160" y="80" fill="#f0f6fc" font-size="11">assert_late_flag_consistency</text>
    <text x="370" y="80" fill="#f0f6fc" font-size="11">fact_shipments</text>
    <text x="490" y="80" fill="#f59e0b" font-size="11" font-weight="700">warning</text>
    <text x="560" y="80" fill="#94a3b8" font-size="10">Got 4423 discrepancies (Canceled orders carrying risk=1)</text>
  </g>
</svg>
